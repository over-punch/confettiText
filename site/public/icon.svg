<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#63c4bc"/>
  <!-- letter-confetti radiating from lower-left, tumbling up-right -->
  <text x="7"  y="24" font-family="Georgia, serif" font-size="9"  font-weight="700" fill="#002c29" transform="rotate(-18 7 24)">a</text>
  <text x="14" y="15" font-family="Georgia, serif" font-size="8"  font-weight="400" fill="#002c29" transform="rotate(22 14 15)">b</text>
  <text x="21" y="11" font-family="Georgia, serif" font-size="9"  font-weight="700" fill="#002c29" transform="rotate(-12 21 11)">c</text>
  <text x="10" y="12" font-family="Georgia, serif" font-size="7"  font-weight="400" fill="#002c29" transform="rotate(30 10 12)">e</text>
  <text x="22" y="22" font-family="Georgia, serif" font-size="8"  font-weight="700" fill="#002c29" transform="rotate(14 22 22)">z</text>
</svg>
